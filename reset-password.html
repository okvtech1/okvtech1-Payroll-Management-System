<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — OKV Nigeria Payroll &amp; HR</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root{ --navy:#0B1F3A; --navy2:#122C52; --navy3:#1B3A6B; --gold:#C9A24B; --gold-light:#E7CE8F; --gold-dark:#A9832E;
    --font-display:'Sora',Arial,sans-serif; --font-body:'Inter',Arial,sans-serif; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; font-family:var(--font-body); color:#fff;
    background:radial-gradient(1200px 700px at 15% -10%, var(--navy3) 0%, var(--navy2) 45%, var(--navy) 100%);
    display:flex; flex-direction:column; }
  .page-wrap{ flex:1 0 auto; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{max-width:420px; width:100%;}
  .mark{ width:52px; height:52px; border-radius:14px; margin-bottom:18px;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark)); color:var(--navy);
    font-family:var(--font-display); font-weight:800; font-size:.95rem;
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px rgba(0,0,0,.32); }
  h1{ font-family:var(--font-display); font-weight:800; font-size:1.4rem; margin:0 0 6px; }
  p.lede{ color:#c6d1e6; font-size:.88rem; margin:0 0 22px; }
  label{ font-size:.8rem; color:#c6d1e6; font-weight:600; margin-bottom:4px; display:block; }
  input{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06); color:#fff; font-size:.92rem; margin-bottom:14px; font-family:var(--font-body); }
  input:focus{ outline:none; border-color:var(--gold); }
  .pw-field{ position:relative; }
  .pw-field input{ padding-right:44px; }
  .pw-toggle{ position:absolute; right:6px; top:0; bottom:14px; width:32px; background:none; border:0; color:#9fb0cc;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .pw-toggle:hover{ color:#fff; }
  .btn{ width:100%; font-weight:700; font-size:.95rem; border:0; border-radius:10px; padding:14px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary{ background:linear-gradient(135deg,var(--gold),var(--gold-dark)); color:var(--navy); }
  .btn-primary:disabled{ opacity:.6; cursor:not-allowed; }
  .msg{ margin-top:14px; font-size:.85rem; padding:12px 14px; border-radius:10px; display:none; }
  .msg.error{ background:rgba(220,53,69,.15); border:1px solid rgba(220,53,69,.4); color:#ffb3bd; display:block; }
  .msg.success{ background:rgba(40,167,69,.15); border:1px solid rgba(40,167,69,.4); color:#a8e6b0; display:block; }
  .foot-link{ text-align:center; margin-top:18px; font-size:.85rem; color:#9fb0cc; }
  .foot-link a{ color:var(--gold-light); text-decoration:none; font-weight:600; }
  .site-footer{ flex-shrink:0; text-align:center; padding:18px 24px 24px; font-size:.8rem; color:#9fb0cc; opacity:.75; }
  .site-footer a{ color:#9fb0cc; text-decoration:none; }
</style>
</head>
<body>
  <div class="page-wrap">
  <div class="card">
    <div class="mark">OKV</div>
    <h1 id="pageTitle">Reset Your Password</h1>
    <p class="lede" id="pageLede">Choose a new password for your account.</p>

    <form id="resetForm">
      <label for="password">New Password</label>
      <div class="pw-field">
        <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>
        <button type="button" class="pw-toggle" onclick="togglePasswordField(this)" tabindex="-1" aria-label="Show password"><i class="bi bi-eye"></i></button>
      </div>
      <label for="confirmPassword">Confirm New Password</label>
      <div class="pw-field">
        <input type="password" id="confirmPassword" placeholder="Re-enter new password" minlength="8" required>
        <button type="button" class="pw-toggle" onclick="togglePasswordField(this)" tabindex="-1" aria-label="Show password"><i class="bi bi-eye"></i></button>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn"><i class="bi bi-key"></i> Reset Password</button>
    </form>
    <div class="msg" id="formMsg"></div>
    <div class="foot-link"><a href="index.html">← Back to login</a></div>
  </div>
  </div>

  <footer class="site-footer">
    technologyokv@gmail.com &middot; +2348104141138 &middot; www.okvtechnology.com<br>
    <a href="../privacy-policy.html">Privacy Policy</a> &middot; <a href="../terms-of-service.html">Terms of Service</a>
  </footer>

<script src="config.js"></script>
<script src="okv-auth.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const form = document.getElementById('resetForm');
  const submitBtn = document.getElementById('submitBtn');
  const msg = document.getElementById('formMsg');

  if(!token){
    document.getElementById('pageTitle').textContent = 'Invalid Reset Link';
    document.getElementById('pageLede').textContent = 'This link is missing a reset token. Request a new one from the login page.';
    form.style.display = 'none';
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    msg.className = 'msg'; msg.textContent = '';
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if(password !== confirmPassword){
      msg.className = 'msg error'; msg.textContent = 'Passwords do not match.';
      return;
    }
    if(!isOnline()){
      msg.className = 'msg error'; msg.textContent = 'You need an internet connection to reset your password.';
      return;
    }
    submitBtn.disabled = true; submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Resetting…';
    try{
      const newPasswordHash = await sha256Hex(password);
      const data = await apiCall('resetPassword', {token, newPasswordHash});
      msg.className = 'msg success';
      msg.textContent = data.message + ' Redirecting to login…';
      form.style.display = 'none';
      setTimeout(() => { window.location.href = 'index.html'; }, 1800);
    }catch(err){
      msg.className = 'msg error'; msg.textContent = err.message;
      submitBtn.disabled = false; submitBtn.innerHTML = '<i class="bi bi-key"></i> Reset Password';
    }
  });
</script>
</body>
</html>
